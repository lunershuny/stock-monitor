<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>選股監控</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #EDF0F3; --panel: #FFFFFF; --ink: #17202B; --sub: #5D6775;
  --line: #D8DDE4; --up: #C42F28; --up-soft: #F8E4E2; --ma: #9AA3AF; --sel: #1E4A84;
  --num: "Barlow Semi Condensed", "Noto Sans TC", system-ui, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11171E; --panel: #19212B; --ink: #E6EBF1; --sub: #93A0AE;
    --line: #2A3440; --up: #F26A62; --up-soft: #3A2224; --ma: #5F6B79; --sel: #8BB2E8;
  }
}
:root[data-theme="dark"] {
  --bg: #11171E; --panel: #19212B; --ink: #E6EBF1; --sub: #93A0AE;
  --line: #2A3440; --up: #F26A62; --up-soft: #3A2224; --ma: #5F6B79; --sel: #8BB2E8;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.6 "Noto Sans TC", system-ui, -apple-system, "PingFang TC", sans-serif;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 720px; margin: 0 auto; padding: 28px 16px 48px; }
h1 { font-size: 1.5rem; line-height: 1.3; margin: 0; letter-spacing: .02em; }
.cond { color: var(--sub); font-size: .875rem; margin: 12px 2px 0; max-width: 60ch; }

.tabs { display: flex; gap: 4px; margin-top: 20px; padding: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
.tab { flex: 1; border: 0; background: none; color: var(--sub); font: 500 .9rem/1.3 inherit; font-family: inherit; padding: 9px 6px; border-radius: 9px; cursor: pointer; }
.tab[aria-selected="true"] { background: var(--sel); color: var(--panel); font-weight: 700; }
.tab:focus-visible { outline: 2px solid var(--sel); outline-offset: 2px; }
.dates { display: flex; gap: 8px; overflow-x: auto; margin: 14px -16px 0; padding: 2px 16px 10px; scrollbar-width: none; }
.dates::-webkit-scrollbar { display: none; }
.chip {
  flex: none; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  border-radius: 10px; padding: 6px 12px; cursor: pointer; text-align: left; font: inherit;
}
.chip b { display: block; font: 600 1.05rem/1.2 var(--num); }
.chip span { font-size: .75rem; color: var(--sub); }
.chip.has span { color: var(--up); font-weight: 500; }
.chip[aria-pressed="true"] { border-color: var(--sel); box-shadow: inset 0 0 0 1px var(--sel); }
.chip:focus-visible, a:focus-visible { outline: 2px solid var(--sel); outline-offset: 2px; }

.day { display: flex; align-items: baseline; justify-content: space-between; margin: 18px 0 10px; }
.day h2 { font-size: 1.05rem; margin: 0; }
.day .count { font: 600 1.6rem/1 var(--num); color: var(--up); }
.day .count small { font: 500 .8rem "Noto Sans TC", sans-serif; color: var(--sub); margin-left: 3px; }

.list { list-style: none; margin: 0; padding: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.item { padding: 14px 16px 12px; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.name { color: inherit; text-decoration: none; font-weight: 700; font-size: 1.05rem; }
.name .code { font: 600 1.05rem var(--num); color: var(--sub); margin-right: 6px; }
.name:hover { text-decoration: underline; }
.price { font: 600 1.4rem/1 var(--num); color: var(--up); }
.spark { display: block; width: 100%; height: auto; margin: 8px 0 6px; }
.spark .px { fill: none; stroke: var(--ink); stroke-width: 1.6; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.spark .ma { fill: none; stroke: var(--ma); stroke-width: 1.4; stroke-dasharray: 4 3; vector-effect: non-scaling-stroke; }
.spark .dot { fill: var(--up); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { font-size: .75rem; color: var(--sub); }
.stat b { display: block; font: 600 1.05rem/1.3 var(--num); color: var(--ink); }
.stat b.up { color: var(--up); }
.legend { display: flex; gap: 14px; font-size: .75rem; color: var(--sub); margin: 10px 2px 0; }
.legend i { display: inline-block; width: 16px; height: 0; border-top: 2px solid var(--ink); vertical-align: middle; margin-right: 5px; }
.legend i.m { border-top: 2px dashed var(--ma); }

.empty { background: var(--panel); border: 1px dashed var(--line); border-radius: 14px; padding: 28px 18px; text-align: center; color: var(--sub); }
footer { color: var(--sub); font-size: .75rem; margin-top: 28px; line-height: 1.7; }
</style>
</head>
<body>
<div class="wrap">
  <h1>選股監控</h1>
  <div class="tabs" id="tabs" role="tablist" aria-label="選股策略"></div>
  <p class="cond" id="cond"></p>
  <nav class="dates" id="dates" aria-label="選擇交易日"></nav>
  <main id="main"></main>
  <footer id="foot"></footer>
</div>
<script>
const DATA = /*DATA*/null;

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = (n, d = 2) => Number(n).toLocaleString("zh-TW", { minimumFractionDigits: d, maximumFractionDigits: d });

function spark(c, m) {
  const vals = c.concat(m).filter(v => v != null);
  if (vals.length < 2) return "";
  const W = 320, H = 64, P = 4, lo = Math.min(...vals), hi = Math.max(...vals);
  const x = i => P + (W - 2 * P) * i / (c.length - 1);
  const y = v => H - P - (H - 2 * P) * (v - lo) / ((hi - lo) || 1);
  const pts = a => a.map((v, i) => v == null ? null : x(i).toFixed(1) + "," + y(v).toFixed(1)).filter(Boolean).join(" ");
  const last = c.length - 1;
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true">
    <polyline class="ma" points="${pts(m)}"/><polyline class="px" points="${pts(c)}"/>
    <circle class="dot" cx="${x(last).toFixed(1)}" cy="${y(c[last]).toFixed(1)}" r="3.5"/></svg>`;
}

let cur = { sid: null, date: null };

function renderDay() {
  const strat = DATA.strategies.find(x => x.id === cur.sid);
  const day = DATA.days.find(x => x.date === cur.date) || DATA.days[0];
  const rows = (day.strategies && day.strategies[cur.sid]) || [];
  const d = new Date(day.date + "T00:00:00");
  const title = `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
  let html = `<div class="day"><h2>${title}</h2><div class="count">${rows.length}<small>檔符合</small></div></div>`;
  if (!rows.length) {
    html += `<div class="empty">這天沒有股票符合「${esc(strat.name)}」。<br>可以換其他日期或策略看看。</div>`;
  } else {
    html += `<ul class="list">` + rows.map(r => `
      <li class="item">
        <div class="top">
          <a class="name" href="https://tw.stock.yahoo.com/quote/${esc(r.code)}" target="_blank" rel="noopener"><span class="code">${esc(r.code)}</span>${esc(r.name)}</a>
          <span class="price">${fmt(r.close)}</span>
        </div>
        ${spark(r.spark || [], r.ref || [])}
        <div class="stats">${(r.stats || []).map(([label, val, hi]) =>
          `<div class="stat">${esc(label)}<b${hi ? ' class="up"' : ""}>${esc(val)}</b></div>`).join("")}</div>
      </li>`).join("") + `</ul>
      <div class="legend"><span><i></i>收盤價</span><span><i class="m"></i>${esc(strat.ref_name)}</span></div>`;
  }
  $("main").innerHTML = html;
  $("cond").textContent = "條件：" + strat.desc;
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", b.dataset.sid === cur.sid));
  $("dates").innerHTML = DATA.days.map(dd => {
    const [, m, x] = dd.date.split("-");
    const n = ((dd.strategies || {})[cur.sid] || []).length;
    return `<button class="chip${n ? " has" : ""}" data-date="${dd.date}" aria-pressed="${dd.date === day.date}"><b>${+m}/${+x}</b><span>${n ? n + " 檔" : "無"}</span></button>`;
  }).join("");
  history.replaceState(null, "", "#" + cur.sid + "/" + day.date);
}

function init() {
  if (!DATA || !DATA.days || !DATA.days.length) {
    $("main").innerHTML = `<div class="empty">還沒有資料。到 GitHub 專案的 Actions 頁面，手動執行一次 daily-scan。</div>`;
    return;
  }
  $("foot").innerHTML = `資料來源：臺灣證券交易所（上市股票）<br>最後更新 ${esc(DATA.updated)}<br>僅供篩選參考，不構成投資建議。`;
  $("tabs").innerHTML = DATA.strategies.map(st =>
    `<button class="tab" role="tab" data-sid="${esc(st.id)}" aria-selected="false">${esc(st.name)}</button>`).join("");
  $("tabs").addEventListener("click", e => {
    const b = e.target.closest(".tab"); if (b) { cur.sid = b.dataset.sid; renderDay(); }
  });
  $("dates").addEventListener("click", e => {
    const b = e.target.closest(".chip"); if (b) { cur.date = b.dataset.date; renderDay(); }
  });
  const [sid, date] = location.hash.slice(1).split("/");
  cur.sid = DATA.strategies.some(x => x.id === sid) ? sid : DATA.strategies[0].id;
  cur.date = DATA.days.some(x => x.date === date) ? date : DATA.days[0].date;
  renderDay();
}
init();
</script>
</body>
</html>
